name: Metallator VSTGUI Milestone Windows CI
on:
  push:
    branches: [v1.0.0-provisional-vstgui]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure VST3 SDK and VSTGUI
        run: cmake -S . -B build -A x64 -DMETALLATOR_BUILD_VST3=ON -DBUILD_TESTING=ON
      - name: Build VST3 and all five DSP suites
        run: cmake --build build --config Release --target 125A_Metallator metallator_core_tests metallator_impact_contract metallator_stereo_contract metallator_diversity_contract metallator_seed_matrix --parallel 2
      - name: Run deterministic regression suites
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify actual VSTGUI plugin bundle
        shell: pwsh
        run: |
          $pkg = "build\VST3\Release\125A_Metallator.vst3"
          $bin = Join-Path $pkg "Contents\x86_64-win\125A_Metallator.vst3"
          $ui = Join-Path $pkg "Contents\Resources\metallator.uidesc"
          foreach ($f in @($bin, $ui)) {
            if (-not (Test-Path $f)) { throw "Missing required VSTGUI binary/resource: $f" }
          }
          [xml]$doc = Get-Content $ui -Raw
          $tags = @($doc.'vstgui-ui-description'.'control-tags'.'control-tag')
          foreach ($id in @('1000','1001','1002','1003','1004','1006','1007','1008','1009')) {
            if (-not ($tags | Where-Object { $_.tag -eq $id })) { throw "Missing binding ID $id" }
          }
          Write-Host "VSTGUI resource, nine parameter IDs, bundle structure PASS"
          Get-FileHash -Algorithm SHA256 $bin
      - name: Upload internal GUI milestone (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Metallator-Provisional-VSTGUI-INTERNAL
          path: build/VST3/Release/125A_Metallator.vst3
          if-no-files-found: error
          retention-days: 7
