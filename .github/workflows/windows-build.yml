name: Metallator V1 Windows CI
on:
  push:
    branches: [v1.0.0-synth-dev]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure SDK 3.8.1
        run: cmake -S . -B build -A x64 -DMETALLATOR_BUILD_VST3=ON -DBUILD_TESTING=ON
      - name: Build instrument and deterministic tests
        run: cmake --build build --config Release --target 125A_Metallator metallator_core_tests metallator_impact_contract metallator_render --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Export four reference WAV files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path exports -Force | Out-Null
          foreach ($engine in @('impact','perc','friction','drone')) {
            & .\build\Release\metallator_render.exe $engine "exports\$engine.wav" 307896358
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload instrument and reference WAVs
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Metallator-v1.0.0-development
          path: |
            build/VST3/Release/125A_Metallator.vst3
            exports/*.wav
          if-no-files-found: error
          retention-days: 7
