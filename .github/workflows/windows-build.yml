name: Metallator V1 Windows CI
on:
  push:
    branches: [v1.0.0-synth-dev, v1.0.0-sound-diversity-audit]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure Steinberg SDK 3.8.1
        run: cmake -S . -B build -A x64 -DMETALLATOR_BUILD_VST3=ON -DBUILD_TESTING=ON
      - name: Build instrument, five regression suites and CPU diagnostic
        run: cmake --build build --config Release --target 125A_Metallator metallator_core_tests metallator_impact_contract metallator_stereo_contract metallator_diversity_contract metallator_seed_matrix metallator_render metallator_bench_core --parallel 2
      - name: Run DSP regression suites
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Export sixteen verified native-Windows reference WAV files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path exports -Force | Out-Null
          foreach ($engine in @('impact','perc','friction','drone')) {
            foreach ($archetype in 0..3) {
              $file = "exports\" + $engine + "_" + $archetype + ".wav"
              & .\build\Release\metallator_render.exe $engine $file 307896358 $archetype
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          $count = (Get-ChildItem exports -Filter *.wav).Count
          if ($count -ne 16) { throw "Expected 16 sound archetypes, got $count" }
      - name: Windows CPU diagnostic (not a realtime PASS)
        shell: pwsh
        run: |
          & .\build\Release\metallator_bench_core.exe > exports\CPU-DIAGNOSTIC.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify VST3 bundle and capture checksums
        shell: pwsh
        run: |
          $plugin = "build\VST3\Release\125A_Metallator.vst3"
          $binary = Join-Path $plugin "Contents\x86_64-win\125A_Metallator.vst3"
          $manifest = Join-Path $plugin "Contents\Resources\moduleinfo.json"
          foreach ($p in @($plugin, $binary, $manifest)) {
            if (-not (Test-Path $p)) { throw "Missing VST3 package item: $p" }
          }
          Get-FileHash -Algorithm SHA256 $binary | Format-List | Out-File exports\BINARY-SHA256.txt
      - name: Upload Windows VST3 and 16 archetype reference WAVs
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Metallator-16-Archetypes-Windows-DEV
          path: |
            build/VST3/Release/125A_Metallator.vst3
            exports/*.wav
            exports/*.txt
          if-no-files-found: error
          retention-days: 7
