name: Metallator V1 Windows CI
on:
  push:
    branches: [v1.0.0-synth-dev, v1.0.0-sound-diversity-audit] # percussion-focus intentionally not built until GUI milestone
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure SDK 3.8.1
        run: cmake -S . -B build -A x64 -DMETALLATOR_BUILD_VST3=ON -DBUILD_TESTING=ON
      - name: Build instrument and deterministic tests
        run: cmake --build build --config Release --target 125A_Metallator metallator_core_tests metallator_impact_contract metallator_render --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Export eight metal-percussion reference WAV files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path exports -Force | Out-Null
          foreach ($engine in @('impact','perc')) {
            foreach ($archetype in 0..3) {
              $file = "exports\" + $engine + "_" + $archetype + ".wav"
              & .\build\Release\metallator_render.exe $engine $file 307896358 $archetype
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          if ((Get-ChildItem exports -Filter *.wav).Count -ne 8) { throw "Expected eight WAVs" }
      - name: Upload instrument and reference WAVs
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Metallator-8-Metal-Percussion-DEV
          path: |
            build/VST3/Release/125A_Metallator.vst3
            exports/*.wav
          if-no-files-found: error
          retention-days: 7
